<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="diSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb3e0"/>
      <stop offset="0.7" stop-color="#a8dcf0"/>
      <stop offset="1" stop-color="#d8f0f8"/>
    </linearGradient>
    <linearGradient id="diSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1594b8"/>
      <stop offset="0.4" stop-color="#25b6c9"/>
      <stop offset="0.8" stop-color="#5fd6d4"/>
      <stop offset="1" stop-color="#a8ece2"/>
    </linearGradient>
    <linearGradient id="diSand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e3"/>
      <stop offset="1" stop-color="#f0e0b8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#diSky)"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="300" cy="140" rx="130" ry="26"/>
    <ellipse cx="380" cy="120" rx="90" ry="20"/>
    <ellipse cx="1150" cy="100" rx="150" ry="24"/>
    <ellipse cx="1240" cy="128" rx="100" ry="18"/>
    <ellipse cx="760" cy="180" rx="80" ry="14"/>
  </g>

  <!-- Sea -->
  <rect x="0" y="420" width="1600" height="260" fill="url(#diSea)"/>
  <!-- Horizon sparkle lines -->
  <g stroke="#ffffff" stroke-width="3" opacity="0.5" stroke-linecap="round">
    <path d="M120,470 h90 M340,500 h60 M700,460 h110 M1000,490 h70 M1330,465 h90"/>
    <path d="M220,540 h70 M560,555 h90 M900,545 h60 M1200,560 h100"/>
  </g>
  <!-- Dhow sailboat -->
  <g transform="translate(1080,430)">
    <path d="M-40,44 Q0,58 44,44 L36,54 Q0,64 -32,54 Z" fill="#5a3c22"/>
    <path d="M4,44 L4,-46 Q40,-18 10,44 Z" fill="#fdf8ec"/>
    <path d="M4,-46 L4,44" stroke="#5a3c22" stroke-width="4"/>
  </g>

  <!-- Breaking surf -->
  <path d="M0,672 C220,660 420,682 640,670 C900,656 1140,680 1380,668 C1460,664 1540,670 1600,666 L1600,700 C1400,712 1100,696 800,708 C500,718 220,702 0,712 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Sand -->
  <path d="M0,700 C260,690 520,712 780,702 C1060,690 1320,712 1600,698 L1600,900 L0,900 Z" fill="url(#diSand)"/>

  <!-- Palm trees -->
  <g>
    <g transform="translate(180,340)">
      <path d="M60,420 Q40,260 76,120 L96,124 Q70,262 92,420 Z" fill="#6b4a2e"/>
      <g fill="#1e7a4a">
        <path d="M84,120 Q20,80 -50,102 Q10,40 84,74 Z"/>
        <path d="M84,118 Q30,60 -20,20 Q60,26 96,88 Z"/>
        <path d="M86,116 Q90,40 60,-16 Q120,20 102,102 Z"/>
        <path d="M88,118 Q150,52 220,50 Q160,110 96,112 Z"/>
        <path d="M88,122 Q170,100 230,130 Q160,150 92,134 Z"/>
      </g>
      <circle cx="88" cy="120" r="10" fill="#8a5a30"/>
      <circle cx="102" cy="128" r="8" fill="#8a5a30"/>
    </g>
    <g transform="translate(1300,300) scale(0.85)">
      <path d="M60,470 Q86,280 50,130 L30,136 Q58,282 30,470 Z" fill="#6b4a2e"/>
      <g fill="#227a4e">
        <path d="M42,130 Q-20,86 -90,106 Q-30,46 42,84 Z"/>
        <path d="M42,128 Q0,64 -44,28 Q36,36 54,96 Z"/>
        <path d="M44,126 Q46,48 20,-8 Q80,28 60,110 Z"/>
        <path d="M46,128 Q110,62 180,62 Q120,120 56,122 Z"/>
        <path d="M46,132 Q130,112 190,142 Q120,160 50,144 Z"/>
      </g>
    </g>
  </g>

  <!-- Beach details -->
  <g fill="#d9c290">
    <ellipse cx="500" cy="810" rx="60" ry="8" opacity="0.6"/>
    <ellipse cx="900" cy="850" rx="80" ry="9" opacity="0.5"/>
    <ellipse cx="1200" cy="800" rx="50" ry="7" opacity="0.6"/>
  </g>
  <!-- Starfish -->
  <path d="M700,830 l6,14 15,2 -11,10 3,15 -13,-8 -13,8 3,-15 -11,-10 15,-2 Z" fill="#e8845f"/>

  <!-- Birds -->
  <g stroke="#4a7a9a" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M600,240 q10,-12 20,0 q10,-12 20,0"/>
    <path d="M680,210 q8,-10 16,0 q8,-10 16,0"/>
  </g>
</svg>
