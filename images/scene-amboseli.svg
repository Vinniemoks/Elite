<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="amSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb2d9"/>
      <stop offset="0.5" stop-color="#b8d4e8"/>
      <stop offset="0.75" stop-color="#e8d9c0"/>
      <stop offset="1" stop-color="#f2e2c4"/>
    </linearGradient>
    <linearGradient id="amMountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6f8f"/>
      <stop offset="1" stop-color="#7d8ba3"/>
    </linearGradient>
    <linearGradient id="amPlain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b478"/>
      <stop offset="1" stop-color="#a3915c"/>
    </linearGradient>
    <linearGradient id="amFore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a7a4a"/>
      <stop offset="1" stop-color="#5f5433"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#amSky)"/>

  <!-- Kilimanjaro massif -->
  <path d="M100,560 Q420,300 700,268 Q800,256 900,268 Q1180,300 1500,560 L1600,560 L1600,620 L0,620 L0,560 Z" fill="url(#amMountain)"/>
  <!-- Snow cap -->
  <path d="M560,330 Q700,272 800,268 Q900,266 1040,326 Q980,318 940,330 Q900,310 860,326 Q820,306 780,324 Q740,306 700,326 Q660,314 620,332 Q590,322 560,330 Z" fill="#f6fbff"/>
  <path d="M620,332 q20,26 8,54 M720,320 q16,30 6,60 M820,316 q12,34 4,62 M920,326 q14,30 8,56" stroke="#f6fbff" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- Haze band -->
  <rect x="0" y="540" width="1600" height="90" fill="#e8dcc0" opacity="0.65"/>

  <!-- Plain -->
  <rect x="0" y="600" width="1600" height="180" fill="url(#amPlain)"/>

  <!-- Scattered acacia on plain -->
  <g fill="#4c4126" opacity="0.85">
    <g transform="translate(1220,600) scale(0.5)">
      <rect x="66" y="30" width="10" height="70"/>
      <ellipse cx="72" cy="24" rx="80" ry="17"/>
    </g>
    <g transform="translate(320,616) scale(0.4)">
      <rect x="66" y="30" width="10" height="70"/>
      <ellipse cx="72" cy="24" rx="80" ry="17"/>
    </g>
  </g>

  <!-- Foreground -->
  <path d="M0,772 C280,756 560,780 840,766 C1120,754 1380,776 1600,764 L1600,900 L0,900 Z" fill="url(#amFore)"/>

  <!-- Elephant herd -->
  <g fill="#3a3220">
    <g transform="translate(560,700)">
      <path d="M0,80 L5,26 Q8,0 40,-3 Q64,-8 80,5 Q104,-3 117,13 L122,34 Q127,58 111,61 L111,80 98,80 95,61 74,61 71,80 58,80 55,58 26,61 24,80 10,80 Z"/>
      <path d="M117,16 q19,5 16,29 q-3,13 -13,13 l-3,19 -8,0" fill="none" stroke="#3a3220" stroke-width="9"/>
      <path d="M40,-3 q-6,-14 4,-22" fill="none" stroke="#3a3220" stroke-width="8"/>
    </g>
    <g transform="translate(760,724) scale(0.62)">
      <path d="M0,80 L5,26 Q8,0 40,-3 Q64,-8 80,5 Q104,-3 117,13 L122,34 Q127,58 111,61 L111,80 98,80 95,61 74,61 71,80 58,80 55,58 26,61 24,80 10,80 Z"/>
      <path d="M117,16 q19,5 16,29 q-3,13 -13,13 l-3,19 -8,0" fill="none" stroke="#3a3220" stroke-width="9"/>
    </g>
    <g transform="translate(880,738) scale(0.4)">
      <path d="M0,80 L5,26 Q8,0 40,-3 Q64,-8 80,5 Q104,-3 117,13 L122,34 Q127,58 111,61 L111,80 98,80 95,61 74,61 71,80 58,80 55,58 26,61 24,80 10,80 Z"/>
    </g>
  </g>

  <!-- Foreground acacia -->
  <g fill="#33301c">
    <g transform="translate(1280,560)">
      <path d="M86,240 L94,120 L88,116 L108,48 L128,116 L122,120 L130,240 Z"/>
      <path d="M108,52 L42,22 M108,52 L180,18 M108,52 L108,-4" stroke="#33301c" stroke-width="8" fill="none"/>
      <ellipse cx="108" cy="8" rx="140" ry="30"/>
    </g>
  </g>

  <!-- Birds -->
  <g stroke="#5a6f8f" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M300,200 q10,-12 20,0 q10,-12 20,0"/>
    <path d="M1300,160 q9,-11 18,0 q9,-11 18,0"/>
  </g>
</svg>
