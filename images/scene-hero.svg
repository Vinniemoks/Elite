<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2b50"/>
      <stop offset="0.3" stop-color="#4a3f70"/>
      <stop offset="0.55" stop-color="#b05a68"/>
      <stop offset="0.75" stop-color="#e88a52"/>
      <stop offset="0.92" stop-color="#ffb45e"/>
      <stop offset="1" stop-color="#ffd07a"/>
    </linearGradient>
    <radialGradient id="hGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0c0" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ffcf80" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffcf80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hHillsA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e3a5e"/>
      <stop offset="1" stop-color="#54294a"/>
    </linearGradient>
    <linearGradient id="hHillsB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93455a"/>
      <stop offset="1" stop-color="#753a52"/>
    </linearGradient>
    <linearGradient id="hPlain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f4536"/>
      <stop offset="1" stop-color="#5e2a26"/>
    </linearGradient>
    <linearGradient id="hFore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1c1c"/>
      <stop offset="1" stop-color="#1e0d10"/>
    </linearGradient>
    <linearGradient id="hBalloon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d94f30"/>
      <stop offset="0.5" stop-color="#f2a03c"/>
      <stop offset="1" stop-color="#d94f30"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#hSky)"/>

  <!-- Rising sun -->
  <circle cx="1260" cy="800" r="420" fill="url(#hGlow)"/>
  <circle cx="1260" cy="800" r="130" fill="#ffedb0"/>
  <circle cx="1260" cy="800" r="112" fill="#fff8dd"/>

  <!-- Cloud streaks -->
  <g opacity="0.55">
    <ellipse cx="420" cy="220" rx="340" ry="16" fill="#31234f"/>
    <ellipse cx="760" cy="300" rx="260" ry="12" fill="#4a2c56"/>
    <ellipse cx="1500" cy="240" rx="300" ry="14" fill="#31234f"/>
    <ellipse cx="1100" cy="480" rx="380" ry="13" fill="#ff9e63"/>
    <ellipse cx="560" cy="540" rx="300" ry="11" fill="#ff9e63"/>
    <ellipse cx="1560" cy="560" rx="260" ry="10" fill="#ffb573"/>
  </g>

  <!-- Hot-air balloons -->
  <g>
    <g transform="translate(430,260)">
      <path d="M0,-90 C58,-90 92,-46 92,4 C92,44 66,74 34,88 L30,108 L-30,108 L-34,88 C-66,74 -92,44 -92,4 C-92,-46 -58,-90 0,-90 Z" fill="url(#hBalloon)"/>
      <path d="M-34,-84 C-14,-92 14,-92 34,-84 M-62,-62 C-30,-80 30,-80 62,-62 M-80,-24 C-40,-48 40,-48 80,-24" stroke="#a33622" stroke-width="5" fill="none" opacity="0.7"/>
      <path d="M-30,108 L-18,140 L18,140 L30,108" stroke="#5a2c18" stroke-width="5" fill="none"/>
      <rect x="-20" y="138" width="40" height="30" rx="5" fill="#6e4326"/>
    </g>
    <g transform="translate(820,150) scale(0.55)" opacity="0.9">
      <path d="M0,-90 C58,-90 92,-46 92,4 C92,44 66,74 34,88 L30,108 L-30,108 L-34,88 C-66,74 -92,44 -92,4 C-92,-46 -58,-90 0,-90 Z" fill="#c94f68"/>
      <path d="M-30,108 L-18,140 L18,140 L30,108" stroke="#5a2c18" stroke-width="5" fill="none"/>
      <rect x="-20" y="138" width="40" height="30" rx="5" fill="#6e4326"/>
    </g>
    <g transform="translate(1650,320) scale(0.4)" opacity="0.85">
      <path d="M0,-90 C58,-90 92,-46 92,4 C92,44 66,74 34,88 L30,108 L-30,108 L-34,88 C-66,74 -92,44 -92,4 C-92,-46 -58,-90 0,-90 Z" fill="#e8b23c"/>
      <rect x="-20" y="138" width="40" height="30" rx="5" fill="#6e4326"/>
    </g>
  </g>

  <!-- Layered hills -->
  <path d="M0,660 L180,630 L360,652 L560,618 L760,648 L960,626 L1180,652 L1400,624 L1620,650 L1920,630 L1920,760 L0,760 Z" fill="url(#hHillsA)" opacity="0.75"/>
  <path d="M0,710 L240,684 L480,706 L720,682 L980,708 L1240,686 L1500,708 L1920,688 L1920,800 L0,800 Z" fill="url(#hHillsB)" opacity="0.85"/>

  <!-- Winding river catching light -->
  <path d="M300,800 C500,780 560,820 760,806 C980,790 1040,830 1280,812 C1460,800 1560,824 1920,808" stroke="#ffca7a" stroke-width="14" fill="none" opacity="0.8"/>

  <!-- Savanna plain -->
  <path d="M0,800 L1920,790 L1920,905 L0,915 Z" fill="url(#hPlain)"/>

  <!-- Mid wildlife: wildebeest herd migrating -->
  <g fill="#331420">
    <g transform="translate(500,865) scale(0.8)">
      <path d="M0,0 q8,-18 26,-18 q8,-12 18,-9 l5,-9 6,9 q15,0 20,11 l9,16 -9,0 -5,-9 -6,9 -11,0 -3,-7 -8,7 -11,0 0,-9 -9,9 Z"/>
    </g>
    <g transform="translate(600,872) scale(0.65)">
      <path d="M0,0 q8,-18 26,-18 q8,-12 18,-9 l5,-9 6,9 q15,0 20,11 l9,16 -9,0 -5,-9 -6,9 -11,0 -3,-7 -8,7 -11,0 0,-9 -9,9 Z"/>
    </g>
    <g transform="translate(680,868) scale(0.72)">
      <path d="M0,0 q8,-18 26,-18 q8,-12 18,-9 l5,-9 6,9 q15,0 20,11 l9,16 -9,0 -5,-9 -6,9 -11,0 -3,-7 -8,7 -11,0 0,-9 -9,9 Z"/>
    </g>
    <!-- zebra pair -->
    <g transform="translate(1420,860) scale(0.75)">
      <path d="M0,0 q6,-20 26,-20 l34,-2 q14,0 18,12 l8,18 -9,0 -5,-10 -7,10 -10,0 -2,-8 -9,8 -10,0 -1,-9 -8,9 Z"/>
      <path d="M60,-22 l7,-14 8,3 -3,13" />
    </g>
  </g>

  <!-- Foreground silhouette band -->
  <path d="M0,905 C320,890 640,915 960,902 C1280,890 1600,912 1920,900 L1920,1080 L0,1080 Z" fill="url(#hFore)"/>

  <!-- Iconic foreground acacia -->
  <g fill="#160a0e">
    <g transform="translate(1460,600)">
      <path d="M130,330 L142,170 L134,165 L162,72 L190,165 L182,170 L196,330 Z"/>
      <path d="M162,76 L64,32 M162,76 L268,26 M162,76 L162,-6 M162,76 L106,0 M162,76 L226,-2" stroke="#160a0e" stroke-width="11" fill="none"/>
      <ellipse cx="162" cy="10" rx="215" ry="42"/>
      <ellipse cx="64" cy="38" rx="80" ry="23"/>
      <ellipse cx="266" cy="32" rx="86" ry="24"/>
    </g>
    <!-- lone giraffe under tree -->
    <g transform="translate(180,900)">
      <path d="M0,150 L8,80 Q6,62 20,55 L66,50 Q76,50 80,38 L98,-42 Q100,-55 110,-55 Q120,-55 120,-42 L120,-35 130,-38 130,-28 120,-25 113,45 Q110,60 96,65 L86,68 93,150 78,150 71,72 38,75 30,150 15,150 Z"/>
      <circle cx="115" cy="-50" r="8"/>
    </g>
    <!-- grass tufts -->
    <g stroke="#160a0e" stroke-width="5" fill="none">
      <path d="M420,1060 q5,-36 -7,-58 M435,1060 q2,-31 12,-53 M450,1060 q-2,-36 -17,-48"/>
      <path d="M1700,1050 q5,-36 -7,-58 M1715,1050 q2,-31 12,-53 M1730,1050 q-2,-36 -17,-48"/>
      <path d="M1080,1070 q5,-31 -5,-50 M1094,1070 q2,-29 10,-46"/>
    </g>
  </g>

  <!-- Birds -->
  <g stroke="#241536" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M560,340 q12,-14 24,0 q12,-14 24,0"/>
    <path d="M640,300 q10,-12 20,0 q10,-12 20,0"/>
    <path d="M500,390 q9,-11 18,0 q9,-11 18,0"/>
  </g>
</svg>
