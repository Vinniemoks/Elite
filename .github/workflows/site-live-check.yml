name: Site Live Check

# Verifies elitetours.co.ke is actually serving the site after each push.
# GitHub Pages deploys the site from the main branch (Pages > Build and
# deployment > Deploy from a branch), so this job just confirms the result.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 30 minutes as a safety net; relax to '0 */6 * * *' once stable.
    - cron: '*/30 * * * *'

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pages usually publishes within a couple of minutes of a push, so
      # poll for up to 10 minutes before declaring the site down.
      - name: Check site is live
        run: node tools/check-live.js --wait 10
        env:
          SITE_URL: https://elitetours.co.ke
          API_URL: https://api.elitetours.co.ke
          # The backend API is not hosted yet. Set to 'false' once
          # api.elitetours.co.ke is deployed so API health is verified too.
          SKIP_API: 'true'
